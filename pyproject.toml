[project]
name = "docflow-xiaomi-ocr-0"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.17.0",
    "opencv-python-headless",
    "beautifulsoup4>=4.15.0",
    "bleach>=6.4.0",
    "ebooklib>=0.20",
    "httpx>=0.28.1",
    "huggingface-hub>=1.5.0,<2.0",
    "mammoth>=1.13.0",
    "markdown2>=2.5.5",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-pptx>=1.0.2",
    "streamlit>=1.66.1",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

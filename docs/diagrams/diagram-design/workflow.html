<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document conversion workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DOCFLOW · WORKFLOW</p>
    <h1>Document conversion workflow</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">Document conversion workflow</title><desc id="workflow-desc">A user uploads, selects pages and starts parsing; incomplete pages remain available for review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M 300 120 V 172" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 300 252 V 304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 300 384 V 436" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 300 516 V 568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 420 476 H 600" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="474.0" y="448" width="72" height="14" rx="2" fill="#f5f5f5"/><text x="510" y="458" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">INCOMPLETE</text><path d="M 720 516 V 600 Q 720 608 712 608 H 420" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="540" y="582" width="100" height="14" rx="2" fill="#f5f5f5"/><text x="590" y="592" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">REVIEW PARTIAL</text><rect x="180" y="40" width="240" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="300.0" y="78.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Upload documents</text><text x="300.0" y="96.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">PDF or image</text><rect x="180" y="172" width="240" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="300.0" y="210.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Select pages</text><text x="300.0" y="228.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">single file or full batch</text><rect x="180" y="304" width="240" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="300.0" y="342.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Parse</text><text x="300.0" y="360.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">explicit user action</text><rect x="180" y="436" width="240" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="300.0" y="474.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Read page regions</text><text x="300.0" y="492.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">V3 layout then Xiaomi OCR</text><rect x="180" y="568" width="240" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="300.0" y="606.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Review and download</text><text x="300.0" y="624.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">Markdown, HTML, JSON, ZIP</text><rect x="600" y="436" width="240" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="720.0" y="474.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Partial result</text><text x="720.0" y="492.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">warnings and errors</text></svg>
    </div><p style="font-size:0.85rem;color:#4f5d75;line-height:1.6;max-width:70ch">The workbench previews a single upload before parsing. Batches process all pages sequentially. See <a href="../../models.md">model details</a>.</p>
  </div>
</body>
</html>

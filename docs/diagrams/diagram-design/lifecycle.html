<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversion result lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DOCFLOW · LIFECYCLE</p>
    <h1>Conversion result lifecycle</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc"><title id="lifecycle-title">Conversion result lifecycle</title><desc id="lifecycle-desc">A submitted conversion checks the cache, processes pages and saves a complete or incomplete result that can be retried.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M 440 260 V 188 Q 440 180 448 180 H 992 Q 1000 180 1000 188 V 260" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="670" y="158" width="100" height="14" rx="2" fill="#f5f5f5"/><text x="720" y="168" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">CACHE HIT</text><path d="M 240 300 H 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279.0" y="274" width="42" height="14" rx="2" fill="#f5f5f5"/><text x="300" y="284" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">START</text><path d="M 520 300 H 640" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="532.0" y="274" width="96" height="14" rx="2" fill="#f5f5f5"/><text x="580" y="284" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">MISS / PARTIAL</text><path d="M 800 300 H 920" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="830.0" y="274" width="60" height="14" rx="2" fill="#f5f5f5"/><text x="860" y="284" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">COMPLETE</text><path d="M 720 340 V 456" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="754.0" y="388" width="72" height="14" rx="2" fill="#f5f5f5"/><text x="790" y="398" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">INCOMPLETE</text><path d="M 640 496 H 440 Q 432 496 432 488 V 340" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="509.0" y="470" width="42" height="14" rx="2" fill="#f5f5f5"/><text x="530" y="480" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="400" text-anchor="middle">RETRY</text><rect x="80" y="260" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="160.0" y="298.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Submitted</text><text x="160.0" y="316.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">parse requested</text><rect x="360" y="260" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="440.0" y="298.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cache check</text><text x="440.0" y="316.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">matching identity</text><rect x="640" y="260" width="160" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="720.0" y="298.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Processing</text><text x="720.0" y="316.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">pages and regions</text><rect x="920" y="260" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="1000.0" y="298.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Complete</text><text x="1000.0" y="316.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">all pages complete</text><rect x="640" y="456" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><text x="720.0" y="494.0" fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Incomplete</text><text x="720.0" y="512.0" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="middle">saved for review</text><text x="80" y="200" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="start">PRIMARY PHASES</text><text x="640" y="418" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="9" font-weight="400" text-anchor="start">RECOVERY</text></svg>
    </div><p style="font-size:0.85rem;color:#4f5d75;line-height:1.6;max-width:70ch">A complete cache hit returns immediately. Incomplete results are processed again when the user retries. See <a href="../../models.md">model details</a>.</p>
  </div>
</body>
</html>
